<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bet Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <h1>Bet Tracker</h1>
        <p class="lede">Player props and records. Viewable by anyone. Editing is locked.</p>
      </div>
      <div class="top-actions">
        <button type="button" id="refreshBtn" class="edit-only" hidden>Refresh ESPN</button>
        <button type="button" class="secondary" id="lockBtn">Unlock</button>
      </div>
    </header>

    <section class="panel" id="lockPanel">
      <h2>Unlock editing</h2>
      <p class="hint">Viewing never needs a code. Add/edit needs the passcode, then a GitHub token so bets write to the repo.</p>
      <div class="grid-2">
        <label>Passcode<input id="passcode" type="password" autocomplete="off" /></label>
        <label>GitHub token<input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_..." /></label>
      </div>
      <div class="actions">
        <button type="button" id="unlockBtn">Unlock</button>
        <button type="button" class="secondary" id="saveTokenBtn">Save token</button>
        <button type="button" class="secondary" id="lockNowBtn">Lock</button>
      </div>
      <p class="status" id="lockStatus"></p>
    </section>

    <section class="filters">
      <label>Sport<select id="filterSport"></select></label>
      <label>Type<select id="filterType">
        <option value="all">All</option>
        <option value="player-prop">Player props</option>
        <option value="record">Team records</option>
        <option value="game">Game results</option>
      </select></label>
      <label>Timeline<select id="filterTimeline">
        <option value="all">All</option>
        <option value="single">Single game</option>
        <option value="season">Season long</option>
      </select></label>
      <label>Status<select id="filterStatus">
        <option value="all">All</option>
        <option value="open">Open</option>
        <option value="hit">Hit</option>
        <option value="miss">Miss</option>
      </select></label>
    </section>

    <section class="panel edit-only" id="formPanel" hidden>
      <h2>Add bet</h2>
      <form id="betForm">
        <div class="grid-4">
          <label>Type<select id="kind">
            <option value="player-prop">Player prop</option>
            <option value="record">Team record (W-L)</option>
            <option value="game">Game result</option>
          </select></label>
          <label>Sport<select id="sport"></select></label>
          <label>Timeline<select id="timeline">
            <option value="season">Season long</option>
            <option value="single">Single game</option>
          </select></label>
          <label>Event date<input id="date" type="date" /></label>
        </div>
        <label>Bet / description<input id="desc" required placeholder="Mahomes 4,500 pass yards" /></label>
        <div class="grid-4">
          <label>Player or team<input id="subject" placeholder="Patrick Mahomes or Chiefs" /></label>
          <label>Market / notes<input id="notes" placeholder="pass yds, over, +110" /></label>
          <label>Target<input id="target" type="number" step="any" value="1" /></label>
          <label>Current<input id="current" type="number" step="any" value="0" /></label>
          <label class="game-only" hidden>Game metric<select id="metric">
            <option value="team-win">Team win</option>
            <option value="spread">Cover spread</option>
            <option value="total-over">Total over</option>
            <option value="total-under">Total under</option>
          </select></label>
          <label class="game-only" hidden>Line<input id="line" type="number" step="any" placeholder="-3.5 or 47.5" /></label>
          <label class="record-only" hidden>Losses<input id="losses" type="number" step="1" value="0" /></label>
        </div>
        <button type="submit">Save bet to GitHub</button>
      </form>
    </section>

    <p class="status" id="statusLine">Loading bets…</p>
    <div id="betList" class="list"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
