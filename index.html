<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bet Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <h1>Bet Tracker</h1>
        <p class="lede">Parlays are joint bets. Each leg has its own bar. Refresh pulls ESPN stats.</p>
      </div>
      <div class="top-actions">
        <button type="button" id="refreshBtn">Refresh ESPN</button>
        <button type="button" class="secondary" id="reportBtn">Chart Report</button>
      </div>
    </header>
    <section class="filters">
      <label>User<select id="filterUser"></select></label>
      <label>Sport<select id="filterSport"></select></label>
      <label>Type<select id="filterType">
        <option value="all">All</option>
        <option value="player-prop">Player props</option>
        <option value="record">Team records</option>
        <option value="parlay">Parlays</option>
        <option value="award">Awards</option>
        <option value="future">Futures</option>
      </select></label>
      <label>Timeline<select id="filterTimeline">
        <option value="all">All</option>
        <option value="single">Single game</option>
        <option value="season">Season long</option>
      </select></label>
      <label>Status<select id="filterStatus">
        <option value="all">All</option>
        <option value="open">Open</option>
        <option value="hit">Hit</option>
        <option value="miss">Miss</option>
      </select></label>
    </section>
    <section class="report" id="reportPanel" hidden aria-live="polite">
      <div class="report-head">
        <div>
          <p class="report-kicker">Filtered chart report</p>
          <h2 id="reportTitle">Bet progress</h2>
        </div>
        <button type="button" class="icon-button" id="closeReportBtn" aria-label="Close chart report">×</button>
      </div>
      <div id="reportError" class="report-error" hidden></div>
      <div class="report-stats" id="reportStats"></div>
      <div class="report-overall">
        <div class="report-progress-label"><span>Overall progress</span><strong id="reportPercent">0%</strong></div>
        <div class="bar report-bar"><span id="reportBar"></span></div>
        <p class="meta" id="reportNote"></p>
      </div>
      <div class="report-chart" id="reportChart"></div>
    </section>
    <p class="status" id="statusLine">Loading bets…</p>
    <div id="betList" class="list"></div>
  </div>
  <script src="scripts/espn-player.js"></script>
  <script src="scripts/team-record.js"></script>
  <script src="app.js"></script>
</body>
</html>
